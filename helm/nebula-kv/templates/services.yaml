apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebula-kv.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebula-kv.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "nebula-kv.selectorLabels" . | nindent 4 }}
  ports:
    - name: kv
      port: {{ .Values.service.kvPort }}
      targetPort: kv
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebula-kv.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebula-kv.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nebula-kv.selectorLabels" . | nindent 4 }}
  ports:
    - name: kv
      port: {{ .Values.service.kvPort }}
      targetPort: kv
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
