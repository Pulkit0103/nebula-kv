apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nebula-kv.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebula-kv.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nebula-kv.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nebula-kv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nebula-kv.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: kv
              containerPort: {{ .Values.service.kvPort }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KV_PORT
              value: "{{ .Values.service.kvPort }}"
            - name: ADMIN_PORT
              value: "{{ .Values.service.adminPort }}"
            - name: SEEDS
              value: {{ include "nebula-kv.seeds" . | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "nebula-kv.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["{{ .Values.persistence.accessMode }}"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
