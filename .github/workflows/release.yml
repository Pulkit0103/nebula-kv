name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI or gh CLI

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 with GPG and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD
        env:
          # Must be set HERE so setup-java can import the passphrase-protected key
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy to Maven Central
        run: mvn deploy -P release --batch-mode --no-transfer-progress
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          # maven-gpg-plugin 3.x reads MAVEN_GPG_PASSPHRASE (gpg.passphrase is deprecated in 3.x)
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
